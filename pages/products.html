<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark py-3 position-sticky top-0">
        <div class="container-fluid px-4">

            <a href="products.html" class="navbar-brand fs-3 fw-bold">
                MyShop
            </a>

            <div class="d-flex align-items-center gap-3">

                <a href="cart.html" class="btn btn-outline-light position-relative">
                    <i class="bi bi-cart3 fs-5"></i>

                    <span id="cartCount"
                        class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle">
                        0
                    </span>
                </a>

                <button id="logoutBtn" class="btn btn-danger px-4">
                    Logout
                </button>

            </div>

        </div>
    </nav>

    <main class="container py-5">

        <div class="text-center mb-5">

            <h1 class="display-4 fw-bold">
                Our Products
            </h1>

            <p class="lead text-muted">
                Explore our latest products
            </p>

        </div>

        <div class="row g-3 mb-4">

            <div class="col-md-5">
                <input type="text" id="searchProduct" class="form-control" placeholder="Search products...">
            </div>

            <div class="col-md-3">
                <select id="filterCategory" class="form-select">
                    <option value="">All Categories</option>
                </select>
            </div>

            <div class="col-md-4">
                <select id="sortProduct" class="form-select">
                    <option value="">Sort Products</option>
                    <option value="Asc">Name: A to Z</option>
                    <option value="Desc">Name: Z to A</option>
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                </select>
            </div>

        </div>

        <div id="productList" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
        </div>

        <div id="emptyProducts" class="text-center py-5 d-none">

            <h4>No Products Available</h4>

            <p class="text-muted">
                Please check again later.
            </p>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="../dist/main.js"></script>

</body>

</html>
