<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <div class="register-card">

                    <h1 class="text-center mb-4">Register</h1>

                    <form id="registerationForm">

                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" id="name" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" required>
                        </div>

                        <div class="form-check mb-3">
                            <input type="checkbox" id="isAdmin" class="form-check-input">

                            <label for="isAdmin" class="form-check-label">
                                Register as Admin
                            </label>
                        </div>

                        <div id="adminCodeContainer" class="mb-3">

                            <label for="adminCode" class="form-label">
                                Admin Code
                            </label>

                            <input type="text" id="adminCode" class="form-control">

                        </div>

                        <button type="submit" class="btn btn-dark w-100">
                            Register
                        </button>

                        <p class="text-center mt-3">
                            Already have an account?
                            <a href="login.html">Login</a>
                        </p>
                        <p id="message"></p>

                    </form>

                </div>

            </div>
        </div>
    </div>

    <script type="module" src="../dist/main.js"></script>

</body>

</html>
