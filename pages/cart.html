<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | MyShop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark py-3 position-sticky top-0">
        <div class="container-fluid px-4">

            <a href="products.html" class="navbar-brand fs-3 fw-bold">
                MyShop
            </a>

            <div class="d-flex align-items-center gap-3">

                <a href="cart.html" class="btn btn-outline-light position-relative">
                    <i class="bi bi-cart3 fs-5"></i>

                    <span id="cartCount"
                        class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle">
                        0
                    </span>
                </a>

                <button id="logoutBtn" class="btn btn-danger px-4">
                    Logout
                </button>

            </div>

        </div>
    </nav>

    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">Shopping Cart</h2>
            <a href="products.html" class="btn btn-outline-dark">
                <i class="bi bi-arrow-left me-1"></i>
                Continue Shopping
            </a>
        </div>

        <div class="row g-4">
            <div class="col-lg-8">
                <div id="cartItems" class="d-flex flex-column gap-3">
                </div>

                <div id="emptyCart" class="card border-0 shadow-sm d-none">
                    <div class="card-body text-center py-5">
                        <i class="bi bi-cart-x display-3 text-secondary"></i>
                        <h4 class="mt-3">Your cart is empty</h4>
                        <p class="text-secondary">
                            Add some products to get started.
                        </p>
                        <a href="products.html" class="btn btn-dark">
                            Browse Products
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div id="orderSummary" class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-4">Order Summary</h5>

                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-secondary">Subtotal</span>
                            <span id="cartSubtotal">₹0.00</span>
                        </div>

                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-secondary">GST</span>
                            <span id="cartGst">₹0.00</span>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between mb-4">
                            <span class="fw-bold">Grand Total</span>
                            <span id="cartGrandTotal" class="fw-bold fs-5">
                                ₹0.00
                            </span>
                        </div>

                        <button id="checkoutBtn" class="btn btn-dark w-100 py-2">
                            Proceed to Checkout
                            <i class="bi bi-arrow-right ms-1"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="checkoutModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content text-center p-4">
                    <div class="modal-body">
                        <h3>Confirm Your Order</h3>
                        <p class="mt-3 text-uppercase">Items will be delivered.</p>

                        <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">
                            Cancel
                        </button>

                        <button type="button" class="btn btn-success" id="confirmOrderBtn">
                            Yes, Place Order
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../dist/main.js"></script>
</body>

</html>
