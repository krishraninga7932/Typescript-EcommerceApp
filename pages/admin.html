<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h1>Admin Dashboard</h1>

            <button id="logoutBtn" class="btn btn-danger">
                Logout
            </button>

        </div>


        <div class="row g-3">

            <div class="col-md-6">

                <div class="card p-3">

                    <h3>Categories</h3>

                    <p>
                        Manage product categories.
                    </p>

                    <button id="manageCategoriesBtn" class="btn btn-dark">
                        Manage Categories
                    </button>

                </div>

            </div>


            <div class="col-md-6">

                <div class="card p-3">

                    <h3>Products</h3>

                    <p>
                        Manage your products.
                    </p>

                    <button id="manageProductsBtn" class="btn btn-dark">
                        Manage Products
                    </button>

                </div>

            </div>

        </div>



        <section id="categorySection" class="d-none mt-4">


            <div class="d-flex justify-content-between align-items-center mb-3">

                <h2>
                    Categories
                </h2>

                <button id="addCategoryBtn" class="btn btn-dark">
                    Add Category
                </button>

            </div>



            <div id="categoryFormContainer" class="card p-3 d-none">

                <form id="categoryForm">

                    <div class="row align-items-end">

                        <div class="col-md-8">

                            <label for="categoryName" class="form-label">
                                Category Name
                            </label>

                            <input type="text" id="categoryName" class="form-control" required>

                        </div>


                        <div class="col-md-4 mt-3 mt-md-0">

                            <button type="submit" class="btn btn-dark w-100">
                                Save Category
                            </button>

                        </div>

                    </div>

                </form>

            </div>



            <div class="table-responsive mt-4">

                <table class="table table-bordered">

                    <thead class="table-dark">

                        <tr>

                            <th>
                                SR.NO
                            </th>

                            <th>
                                Category Name
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="categoryTableBody">


                    </tbody>

                </table>

            </div>

        </section>



        <section id="productSection" class="d-none mt-4">

            <div class="d-flex justify-content-between align-items-center mb-3">

                <h2>
                    Products
                </h2>

                <button id="addProductBtn" class="btn btn-dark">
                    Add Product
                </button>

            </div>



            <div id="productFormContainer" class="card p-3 d-none">

                <form id="productForm">

                    <div class="row g-3">


                        <div class="col-md-6">

                            <label for="productName" class="form-label">
                                Product Name
                            </label>

                            <input type="text" id="productName" class="form-control" required>

                        </div>



                        <div class="col-md-6">

                            <label for="productImageUrl" class="form-label">
                                Image URL
                            </label>

                            <input type="url" id="productImageUrl" class="form-control" required>

                        </div>



                        <div class="col-6">

                            <label for="productDescription" class="form-label">
                                Description
                            </label>

                            <textarea id="productDescription" class="form-control" rows="3" required></textarea>

                        </div>
                        <div class="col-md-6">
                            <label for="productPrice" class="form-label">
                                Product Price (₹)
                            </label>
                            <input type="number" id="productPrice" class="form-control" min="1" step="1" required>
                        </div>



                        <div class="col-md-6">

                            <label for="productCategory" class="form-label">
                                Category
                            </label>

                            <select id="productCategory" class="form-select" required>
                                <option value="">
                                    Select Category
                                </option>
                            </select>

                        </div>



                        <div class="col-md-6">

                            <label class="form-label">
                                Status
                            </label>

                            <div class="form-check">

                                <input type="checkbox" id="productIsActive" class="form-check-input" checked>

                                <label for="productIsActive" class="form-check-label">
                                    Active
                                </label>

                            </div>

                        </div>



                        <div class="col-12">

                            <button type="submit" class="btn btn-dark">
                                Save Product
                            </button>

                        </div>

                    </div>

                </form>

            </div>



            <div class="table-responsive mt-4">

                <table class="table table-bordered">

                    <thead class="table-dark">

                        <tr>
                            <th>SR.NO</th>
                            <th>Image</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="productTableBody">

                    </tbody>

                </table>

            </div>

        </section>

    </div>



    <script type="module" src="../dist/main.js"></script>

</body>

</html>
